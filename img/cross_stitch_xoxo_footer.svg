<svg width="100%" viewBox="0 0 690 120" role="img" style="" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Repeating cross-stitch XOXO pattern</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A seamless horizontal strip of alternating hand-stitched X and O cross-stitch motifs on a fabric-toned background, for use as a website footer.</desc>
<defs>
<pattern id="xoxoTile" x="0" y="0" width="120" height="110" patternUnits="userSpaceOnUse">
<rect class="fabric" x="0" y="0" width="120" height="110"/>
<circle class="hole" cx="15" cy="15" r="1.4"/>
<circle class="hole" cx="105" cy="15" r="1.4"/>
<circle class="hole" cx="15" cy="95" r="1.4"/>
<circle class="hole" cx="105" cy="95" r="1.4"/>
<line class="stitch pink" x1="12" y1="30" x2="48" y2="66"/>
<line class="stitch pink" x1="48" y1="30" x2="12" y2="66"/>
<circle class="stitch coral" cx="90" cy="48" r="17" fill="none"/>
</pattern>
</defs>

<rect x="0" y="0" width="680" height="110" fill="url(#xoxoTile)" style="stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<rect x="0" y="0" width="680" height="4" fill="#d9587a" opacity="0.25" style="fill:rgb(217, 88, 122);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.25;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<rect x="0" y="106" width="680" height="4" fill="#d9587a" opacity="0.25" style="fill:rgb(217, 88, 122);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.25;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
</svg>